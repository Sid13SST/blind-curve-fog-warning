<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blind-curve fog warning, in 3D</title><meta name="description" content="Interactive 3D simulation of a two-sensor fog warning system at a blind hill curve. All readings simulated."><style>html, body, #root { margin: 0; min-height: 100%; }
body { background: var(--ds-page); }
.fg-stage { position: relative; border-radius: 16px; overflow: hidden; background: #0d1420; margin: 8px 0 4px; }
.fg-canvas { display: block; width: 100%; height: 460px; touch-action: pan-y; }
@media (max-width: 600px) { .fg-canvas { height: 380px; } }
.fg-hud { position: absolute; top: 10px; left: 10px; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
.fg-chip { background: rgba(10,16,26,.72); color: #e8eef4; font-size: 11px; line-height: 1; padding: 7px 10px; border-radius: 999px; letter-spacing: .04em; font-weight: 600; width: max-content; max-width: 78vw; }
.fg-chip .fg-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; background: #5b6b7d; }
.fg-chip.fg-on .fg-dot { background: #ffb02e; box-shadow: 0 0 6px #ffb02e; }
.fg-chip.fg-live .fg-dot { background: #ff4545; box-shadow: 0 0 6px #ff4545; }
.fg-chip.fg-ok .fg-dot { background: #46c98d; box-shadow: 0 0 6px #46c98d; }
.fg-label { position: absolute; transform: translate(-50%, -100%); background: rgba(10,16,26,.78); color: #dfe7ee; font-size: 10.5px; padding: 5px 8px; border-radius: 6px; white-space: nowrap; pointer-events: none; letter-spacing: .02em; }
.fg-label b { color: #ffc86b; font-weight: 600; }
.fg-label::after { content: ""; position: absolute; left: 50%; top: 100%; width: 1px; height: 14px; background: rgba(255,255,255,.35); }
.fg-warn { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); background: #ffb02e; color: #1b1206; font-weight: 700; font-size: 13px; padding: 9px 16px; border-radius: 8px; letter-spacing: .05em; opacity: 0; transition: opacity .25s; pointer-events: none; text-align: center; box-shadow: 0 0 24px rgba(255,176,46,.55); }
.fg-warn.fg-show { opacity: 1; animation: fgblink .8s steps(2, jump-none) infinite; }
@keyframes fgblink { 50% { opacity: .45; } }
.fg-controls { display:flex; flex-direction:column; gap:10px; margin:12px 0 2px; }
.fg-controls > * { min-height: 44px; }
.fg-note { font-size: 12px; color: var(--ds-ink-2); margin: 2px 0 0; }
:root{--ds-page:#0d1420}
body{color:#e8eef4;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.55}
.page{max-width:980px;margin:0 auto;padding:28px 18px 60px}
h1{font-size:clamp(30px,6vw,52px);margin:4px 0 10px;line-height:1.05}
h2{font-size:24px;margin:6px 0 14px}
.eyebrow{color:#ffb02e;text-transform:uppercase;letter-spacing:.12em;font-size:12px;font-weight:700;margin:0}
.intro{color:#b9c6d3;font-size:17px;max-width:720px}
section{margin-top:44px}
.steps{padding-left:22px;color:#cfd9e3}.steps li{margin:10px 0}
.row{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-top:1px solid #243247}
.row b{display:block}.row span{color:#9fb0c1;font-size:14px}.row em{color:#ffb02e;font-style:normal;white-space:nowrap;font-size:13px}
.callout{border-left:4px solid #ffb02e;background:#18222f;padding:12px 16px;border-radius:8px}.callout p{margin:6px 0 0;color:#cfd9e3}
.cap{color:#8fa1b3;font-size:13px}
.choice{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.choice span{color:#9fb0c1;font-size:13px;width:70px}
.choice button{background:#1a2535;color:#e8eef4;border:1px solid #2c3b52;border-radius:999px;padding:10px 14px;font-size:14px;cursor:pointer}
.choice button.on{background:#ffb02e;color:#1b1206;border-color:#ffb02e;font-weight:700}
.slider{display:flex;align-items:center;gap:12px;font-size:14px;color:#9fb0c1}.slider input{flex:1;min-width:140px}
.fg-controls{flex-direction:column;align-items:stretch}
footer{margin-top:50px;color:#8fa1b3;font-size:13px;border-top:1px solid #243247;padding-top:14px}

.page{max-width:none;padding:0}
.page>section,.page>footer,.fg-cap,.cap{max-width:980px;margin-left:auto;margin-right:auto;padding-left:18px;padding-right:18px}
.fg-hero{position:relative;height:100vh;height:100svh;min-height:600px;background:#0d1420}
.fg-stage{position:absolute;inset:0;margin:0;border-radius:0}
.fg-canvas{height:100%!important;width:100%}
.fg-title{position:absolute;left:clamp(16px,4vw,56px);bottom:150px;max-width:min(640px,88vw);pointer-events:none;text-shadow:0 2px 24px rgba(0,0,0,.65)}
.fg-title h1{font-size:clamp(34px,7vw,76px);margin:6px 0 8px;letter-spacing:-.02em}
.fg-title .intro{font-size:clamp(14px,1.6vw,18px);margin:0;color:#dbe4ee}
.fg-hud{left:auto;right:14px;top:14px;align-items:flex-end}
.fg-hero:after{content:"";position:absolute;inset:auto 0 0 0;height:55%;background:linear-gradient(transparent,rgba(8,12,20,.82));pointer-events:none}
.fg-stage{z-index:0}.fg-controls{position:absolute;z-index:2;left:50%;transform:translateX(-50%);bottom:18px;width:min(940px,94vw);background:rgba(10,16,26,.62);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:12px 16px;box-sizing:border-box}
.fg-title{z-index:1}.fg-hud{z-index:1}
.fg-warn{bottom:auto;top:38%;font-size:clamp(16px,3vw,30px);padding:14px 26px}
.fg-stage{overflow:hidden}
@media(max-width:600px){.fg-title{bottom:230px}.fg-chip{font-size:10px}.fg-hud{right:8px;top:8px}.choice button{padding:8px 11px;font-size:13px}.fg-controls{gap:6px;padding:10px 12px}}

.fg-stage{z-index:auto}.fg-hero:after{z-index:0}.fg-title{bottom:215px}.fg-title h1{font-size:clamp(34px,6vw,64px)}
@media(max-width:600px){.fg-title{bottom:250px}}
.fg-warn{top:19%!important}

.fg-title{top:14px!important;bottom:auto!important;left:16px!important;max-width:60vw;text-shadow:0 2px 14px rgba(0,0,0,.8)}
.fg-title h1{font-size:clamp(18px,2.4vw,26px)!important;margin:2px 0 0!important;letter-spacing:0}
.fg-title .eyebrow{font-size:10px}
.fg-hero:after{height:30%}
.fg-warn{top:14px!important;bottom:auto!important;font-size:14px!important;padding:8px 14px!important;border-radius:999px!important}
.fg-controls{bottom:12px!important;width:min(760px,94vw)!important;padding:8px 12px!important;gap:6px!important;border-radius:14px!important}
.fg-r1{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center}
.fg-r1 .slider{flex:1;min-width:150px}
.choice button{padding:6px 12px!important;font-size:13px!important}
.fg-controls>*{min-height:0!important}
.choice span{width:56px}
.fg-more{position:absolute;right:14px;bottom:20px;z-index:2;color:#dbe4ee;font-size:12px;text-decoration:none;background:rgba(10,16,26,.6);padding:6px 10px;border-radius:999px}
.fg-hud{top:50px!important;right:auto!important;left:14px!important;align-items:flex-start!important}
.fg-chip{font-size:11px;padding:6px 9px}
.fg-label{font-size:10px;padding:3px 6px}
@media(max-width:700px){.fg-warn{top:auto!important;bottom:150px!important;font-size:12px!important}.fg-more{display:none}.fg-title h1{font-size:18px!important}.fg-chip{font-size:9.5px;padding:5px 8px}.choice span{width:auto}.choice button{padding:6px 10px!important;font-size:12px!important}.fg-r1 .slider{min-width:120px}}
.fg-hud{top:66px!important}
@media(max-width:700px){.fg-hud{top:56px!important}}
@media(max-width:700px){.fg-title{max-width:92vw!important}}
.fg-controls{box-sizing:border-box;overflow:hidden}
.fg-r1{width:100%}
.fg-r1 .slider{min-width:0!important;flex:1 1 140px}
.slider input{min-width:0;width:100%}
@media(max-width:700px){.fg-controls{width:calc(100vw - 24px)!important}.fg-r1{gap:6px 10px}.fg-r1 .slider{flex:1 1 100px}}

.fg-smoke{position:absolute;z-index:2;right:14px;top:14px;width:276px;box-sizing:border-box;background:rgba(10,16,26,.8);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(255,176,46,.5);border-radius:14px;padding:10px 12px;transition:box-shadow .3s,border-color .3s}
.fg-smoke.trig{border-color:#ff5a45;box-shadow:0 0 26px rgba(255,90,69,.4)}
.fg-sm-h{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.08em}
.fg-sm-h b{color:#fff}.fg-sm-h em{margin-left:auto;font-style:normal;font-size:10px;color:#ffc86b}
.fg-sm-ic{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle,#46c98d 0 22%,#e9eef3 25% 62%,#9fb0c1 65%);border:2px solid #e9eef3;flex:none;box-sizing:border-box}
.trig .fg-sm-ic{background:radial-gradient(circle,#ff4545 0 22%,#e9eef3 25% 62%,#9fb0c1 65%);animation:fgblink .8s steps(2,jump-none) infinite}
.fg-sm-bar{position:relative;height:10px;border-radius:6px;background:#1a2535;margin:10px 0 6px}
.fg-sm-bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#46c98d,#ffb02e 55%,#ff4545);transition:width .2s}
.fg-sm-bar s{position:absolute;left:50%;top:-4px;bottom:-4px;width:2px;background:#fff}
.fg-sm-r{font-size:11px;color:#b9c6d3}.fg-sm-r b{color:#fff;font-size:13px}
.fg-sm-st{display:flex;gap:4px;list-style:none;margin:8px 0 0;padding:0}
.fg-sm-st li{flex:1;font-size:9.5px;line-height:1.25;text-align:center;padding:5px 3px;border-radius:6px;background:#162130;color:#7d90a4}
.fg-sm-st li.on{background:#ffb02e;color:#1b1206;font-weight:700}
.fg-sm-st li.al.on{background:#ff4545;color:#fff}
.fg-label-smoke{background:rgba(255,176,46,.95)!important;color:#1b1206!important;font-weight:800;font-size:12px!important;padding:5px 9px!important;border-radius:8px;box-shadow:0 0 14px rgba(255,176,46,.6)}
.fg-label-smoke::after{background:#ffb02e!important;width:2px!important}
@media(max-width:700px){.fg-smoke{left:12px;right:12px;width:auto;top:auto;bottom:128px;padding:7px 10px}.fg-sm-h{font-size:11px}.fg-sm-bar{margin:7px 0 4px}.fg-sm-st{margin-top:6px}.fg-sm-st li{font-size:8.5px;padding:4px 2px}.fg-hud{top:56px!important}.fg-warn{bottom:auto!important;top:auto!important;bottom:290px!important}}
.fg-info{position:absolute;z-index:2;left:14px;bottom:100px;width:min(330px,60vw);box-sizing:border-box;background:rgba(10,16,26,.84);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:10px 12px;font-size:12px;line-height:1.4;color:#dbe4ee}
.fg-info b{display:block;color:#ffc86b;font-size:13px;margin-bottom:4px}.fg-info p{margin:3px 0}
@media(max-width:700px){.fg-info{left:12px;right:12px;width:auto;bottom:128px;font-size:11px;padding:8px 10px}.fg-info p{margin:2px 0}.fg-smoke.fg-hide-m{display:none}}
